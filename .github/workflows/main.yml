name: Build Windows, Android & iOS Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach files to (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Windows Launcher
        shell: python
        run: |
          code = """import sys, os
          def resolve_path(p):
              return os.path.join(getattr(sys, '_MEIPASS', os.path.dirname(__file__)), p)
          if __name__ == '__main__':
              sys.argv = ['streamlit', 'run', resolve_path('app.py'), '--global.developmentMode=false']
              from streamlit.web import cli as stcli
              sys.exit(stcli.main())
          """
          with open("run_desktop.py", "w") as f:
              f.write(code)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --name PromptEngineeringStudio-Windows --add-data "app.py;." --collect-all streamlit --collect-all audio_recorder_streamlit --collect-all speech_recognition --collect-all openai --collect-all huggingface_hub --copy-metadata streamlit run_desktop.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: dist/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flet Project
        run: |
          mkdir -p mobile_build/src
          cp mobile_app.py mobile_build/src/main.py
          cp app.py mobile_build/src/app.py
          cat << 'EOF' > mobile_build/pyproject.toml
          [project]
          name = "prompt-engineering-studio"
          version = "1.0.1"
          description = "Prompt Engineering Studio"
          requires-python = ">=3.10"
          dependencies = ["flet", "streamlit", "openai", "huggingface-hub", "audio-recorder-streamlit", "SpeechRecognition"]
          EOF

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Build Android APK
        working-directory: mobile_build
        run: flet build apk --output ./out

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: mobile_build/out/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flet Project
        run: |
          mkdir -p mobile_build/src
          cp mobile_app.py mobile_build/src/main.py
          cp app.py mobile_build/src/app.py
          cat << 'EOF' > mobile_build/pyproject.toml
          [project]
          name = "prompt-engineering-studio"
          version = "1.0.1"
          description = "Prompt Engineering Studio"
          requires-python = ">=3.10"
          dependencies = ["flet", "streamlit", "openai", "huggingface-hub", "audio-recorder-streamlit", "SpeechRecognition"]
          EOF

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Build iOS IPA
        working-directory: mobile_build
        run: flet build ipa --no-codesign --output ./out

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: mobile_build/out/*.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
